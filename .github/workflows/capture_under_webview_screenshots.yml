name: Capture under-webview screenshots (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/under-webview-pdf-mode-6c33

jobs:
  android_screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Build plugin and example app
        run: |
          set -euo pipefail
          bun i
          bash ./.github/scripts/verify-packed-example.sh android
          cd "$RUNNER_TEMP/plugin-example-app"
          bunx cap sync android
          cd android
          ./gradlew assembleDebug
      - name: Screenshot on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            set -euo pipefail
            adb wait-for-device
            adb install -r "$RUNNER_TEMP/plugin-example-app/android/app/build/outputs/apk/debug/app-debug.apk"
            adb shell am start -a android.intent.action.VIEW -d "capacitor://localhost#custom-ui" app.capgo.pdfviewer/.MainActivity
            sleep 10
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/screenshots/android-under-webview-raw.png"
      - uses: actions/upload-artifact@v4
        with:
          name: android-under-webview
          path: screenshots/android-under-webview-raw.png

  ios_screenshot:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Build plugin and example app
        run: |
          set -euo pipefail
          bun i
          bash ./.github/scripts/verify-packed-example.sh ios
          cd "$RUNNER_TEMP/plugin-example-app"
          bunx cap sync ios
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 16' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          APP_PATH=$(find build -name 'App.app' -path '*iphonesimulator*' | head -1)
          xcrun simctl boot 'iPhone 16' || true
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl launch booted app.capgo.pdfviewer
          xcrun simctl openurl booted 'capacitor://localhost#custom-ui'
          sleep 10
          xcrun simctl io booted screenshot "$GITHUB_WORKSPACE/screenshots/ios-under-webview-raw.png"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-under-webview
          path: screenshots/ios-under-webview-raw.png
