name: Capture under-webview screenshots

on:
  workflow_dispatch:

jobs:
  android_build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANDROID_USER_HOME: /home/runner/.android
      ANDROID_EMULATOR_HOME: /home/runner/.android
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Build example debug APK
        run: |
          set -euo pipefail
          bun i
          bash ./.github/scripts/verify-packed-example.sh android
          EXAMPLE="$RUNNER_TEMP/plugin-example-app"
          cd "$EXAMPLE"
          bun run generate:pdf
          VITE_CAPTURE_CUSTOM_UI=true bun run build
          bunx cap sync android
          cd android
          ./gradlew assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/capture-out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/capture-out/app-debug.apk"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: capture-android-apk
          path: capture-out/app-debug.apk

  android_screenshot:
    needs: android_build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANDROID_USER_HOME: /home/runner/.android
      ANDROID_EMULATOR_HOME: /home/runner/.android
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: capture-android-apk
          path: capture-out
      - name: Install emulator dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libpulse0 libxcb-cursor0 libxcb1 libxdamage1 libxi6 libxtst6
          mkdir -p "$ANDROID_AVD_HOME"
      - name: Enable KVM for emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Screenshot on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-snapshot-save -no-snapshot-load -gpu swiftshader_indirect
          script: |
            set -eu
            adb install -r "$GITHUB_WORKSPACE/capture-out/app-debug.apk"
            adb shell am start -n app.capgo.pdfviewer/.MainActivity
            sleep 25
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/capture-out/android-under-webview-raw.png"
      - name: Upload Android screenshot
        uses: actions/upload-artifact@v7
        with:
          name: android-under-webview-screenshot
          path: capture-out/android-under-webview-raw.png

  ios_build:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      CAPTURE_EXAMPLE_PATH_FILE: ${{ runner.temp }}/capture-example-path.txt
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Build iOS simulator app bundle
        run: |
          set -euo pipefail
          bun i
          bash ./.github/scripts/prepare-capture-example.sh ios
          EXAMPLE=$(cat "$CAPTURE_EXAMPLE_PATH_FILE")
          cd "$EXAMPLE"
          bun run generate:pdf
          VITE_CAPTURE_CUSTOM_UI=true bun run build
          bunx cap sync ios

          UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[].value[] |
              select(.isAvailable == true and (.name | test("^iPhone"))) |
              .udid][0]')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            RUNTIME=$(xcrun simctl list runtimes available -j | jq -r '
              [.runtimes[] | select(.isAvailable == true and (.identifier | test("iOS"))) |
                .identifier][-1]')
            UDID=$(xcrun simctl create "PdfViewerCapture" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$RUNTIME")
          fi

          cd ios/App
          DERIVED="$RUNNER_TEMP/DerivedData"
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PATH=$(find "$DERIVED" -path '*iphonesimulator*' -name 'App.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "App.app not found under $DERIVED"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/capture-out"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$GITHUB_WORKSPACE/capture-out/App.zip"
      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v7
        with:
          name: capture-ios-app
          path: capture-out/App.zip

  ios_screenshot:
    needs: ios_build
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Download iOS app bundle
        uses: actions/download-artifact@v8
        with:
          name: capture-ios-app
          path: capture-out
      - name: Capture screenshot on simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[].value[] |
              select(.isAvailable == true and (.name | test("^iPhone"))) |
              .udid][0]')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            RUNTIME=$(xcrun simctl list runtimes available -j | jq -r '
              [.runtimes[] | select(.isAvailable == true and (.identifier | test("iOS"))) |
                .identifier][-1]')
            UDID=$(xcrun simctl create "PdfViewerCapture" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$RUNTIME")
          fi

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

          unzip -q capture-out/App.zip -d capture-out
          APP_PATH="capture-out/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App.app not found after unzip at $APP_PATH"
            exit 1
          fi

          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" app.capgo.pdfviewer
          sleep 22

          mkdir -p "$GITHUB_WORKSPACE/capture-out"
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/capture-out/ios-under-webview-raw.png"
      - name: Upload iOS screenshot
        uses: actions/upload-artifact@v7
        with:
          name: ios-under-webview-screenshot
          path: capture-out/ios-under-webview-raw.png
