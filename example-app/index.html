<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <title>@capgo/capacitor-pdf-viewer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="custom-pdf-ui" class="custom-pdf-ui" hidden aria-hidden="true">
      <div class="custom-toolbar">
        <button type="button" id="custom-prev" aria-label="Previous page">Prev</button>
        <span id="custom-page-indicator">1 / 1</span>
        <button type="button" id="custom-next" aria-label="Next page">Next</button>
        <button type="button" id="custom-zoom-out" aria-label="Zoom out">−</button>
        <button type="button" id="custom-zoom-in" aria-label="Zoom in">+</button>
        <button type="button" id="custom-close" aria-label="Close PDF">Close</button>
      </div>
    </div>

    <main class="container" id="demo-shell">
      <header class="brand">
        <img class="logo" src="/capgo-logo.webp" width="44" height="44" alt="" />
        <div>
          <p class="name">Capgo</p>
          <h1>PDF Viewer</h1>
        </div>
      </header>
      <p class="lead">Open a PDF fullscreen, inline, or behind this WebView with your own HTML toolbar.</p>

      <div id="inline-pdf" class="inline-box" aria-label="Inline PDF area"></div>

      <div class="actions">
        <button id="open-fullscreen" type="button">Open fullscreen</button>
        <button id="open-inline" type="button">Open inline</button>
        <button id="open-custom-ui" type="button">Custom UI (toBack)</button>
        <button id="open-url" type="button" hidden>Open from URL</button>
        <button id="prev-page" type="button">Prev page</button>
        <button id="next-page" type="button">Next page</button>
        <button id="jump-page" type="button">Jump to page 2</button>
        <button id="zoom-in" type="button">Zoom in</button>
        <button id="close-pdf" type="button">Close</button>
        <button id="get-version" type="button">Get version</button>
      </div>

      <pre id="plugin-output">Events will appear here.</pre>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
