appId: app.capgo.pdfviewer
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'PDF Viewer'
    timeout: 45000
- extendedWaitUntil:
    visible: 'E2E: auto start'
    timeout: 60000
- extendedWaitUntil:
    visible: 'e2e: E2E: open-with-color ok'
    timeout: 60000
- extendedWaitUntil:
    visible: 'e2e: E2E: open-without-color ok'
    timeout: 60000
- extendedWaitUntil:
    visible: 'e2e: E2E: invalid-color ok'
    timeout: 60000