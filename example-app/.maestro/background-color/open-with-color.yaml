appId: app.capgo.pdfviewer
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'PDF Viewer'
    timeout: 45000
- scrollUntilVisible:
    element: 'E2E open with bg'
    direction: DOWN
    timeout: 30000
- tapOn: 'E2E open with bg'
- extendedWaitUntil:
    visible: 'E2E: open-with-color ok'
    timeout: 60000